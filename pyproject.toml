[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamlit-app"
version = "1.0.0"
description = "Streamlit app with SQLite"
requires-python = ">=3.8"
dependencies = [
    "streamlit==1.28.1",
    "pandas==2.0.3",
    "sqlalchemy==2.0.21",
]

[project.scripts]
app = "app:main"
